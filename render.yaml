# render.yaml
# ─────────────
# Render.com deployment configuration for the Velour FastAPI backend.
# Push this to GitHub, then connect the repo in your Render dashboard.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: velour-api
    runtime: python
    region: singapore          # closest region for Indian traffic
    plan: free                 # upgrade to starter ($7/mo) for production

    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    # ── Health Check ──────────────────────────
    healthCheckPath: /api/health

    # ── Environment Variables ─────────────────
    # Set these in the Render dashboard under "Environment"
    # Do NOT put real values here — this file goes to Git!
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false            # Render will prompt you to enter this securely
      - key: ALLOWED_ORIGINS
        value: '["https://velour.netlify.app"]'   # replace with your Netlify URL
      - key: LOG_CHAT_TO_FILE
        value: "false"         # use false on Render free tier (ephemeral filesystem)
